<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Media Grabber</title>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="20" height="20" />
        <span>Media Grabber</span>
      </div>
      <div class="header-actions">
        <button id="settings-toggle" class="icon-button" title="設定">設定</button>
        <button id="clear" class="icon-button" title="このタブの検出結果を消去">消去</button>
      </div>
    </header>

    <section id="settings" class="settings hidden">
      <label>
        <span>保存先サブフォルダ</span>
        <input type="text" id="subfolder" placeholder="MediaGrabber" />
      </label>
      <p class="settings-note">
        保存先は「Chrome のダウンロード フォルダー + ここで指定したサブフォルダ」になります。
        拡張機能から絶対パスは指定できないため、例えば <code>N:\Videos\MediaGrabber</code>
        に保存したい場合は、Chrome の設定 (chrome://settings/downloads) でダウンロード先を
        <code>N:\Videos</code> にしてください。
      </p>
      <label>
        <span>同時ダウンロード数</span>
        <input type="number" id="concurrency" min="1" max="16" />
      </label>
      <label class="checkbox">
        <input type="checkbox" id="saveAs" />
        <span>保存時に保存先を確認する</span>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="saveHelperBat" />
        <span>MP4 にする .bat を一緒に保存する</span>
      </label>
      <button id="save-settings" class="primary small">設定を保存</button>
    </section>

    <main id="list"></main>

    <section id="jobs"></section>

    <footer>
      <span id="status">検出待ち</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
